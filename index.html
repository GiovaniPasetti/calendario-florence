<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087eb5">
  <title>Reservas do Salão — Florence</title>
  <style>
    :root {
      color-scheme: light;
      --ink:#102b3b; --muted:#607b89; --line:#d6e7ee;
      --paper:#ffffff; --bg:#eaf7fb; --blue:#087eb5;
      --blue-dark:#07547d; --blue-soft:#d9f1fa;
      --past:#e4e8eb; --past-ink:#59636b;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; color:var(--ink);
      background:linear-gradient(155deg,#e7f8fc 0%,#d2f1f8 48%,#f4fcfd 100%);
      font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      min-height:100vh;
    }
    main { max-width:1020px; margin:0 auto; padding:26px 18px 42px; }
    header {
      display:flex; align-items:center; justify-content:space-between;
      gap:18px; margin-bottom:22px; padding:14px 18px;
      background:linear-gradient(110deg,#087eb5,#12a9cf);
      border-radius:18px; box-shadow:0 8px 24px #07547d24;
    }
    .brand { display:flex; align-items:center; gap:18px; min-width:0; }
    .brand img { display:block; width:min( min(100%, 340px), 42vw); max-height:104px; object-fit:contain; }
    .brand-copy { color:white; }
    h1 { font-size:clamp(1.25rem,3vw,1.8rem); margin:0 0 4px; letter-spacing:-.02em; }
    .subtitle { color:#e7f9ff; margin:0; font-size:.92rem; }
    .header-actions { display:flex; flex-direction:column; align-items:flex-end; gap:9px; }
    .download-app { display:inline-block; padding:10px 14px; border-radius:11px; background:#fff; color:#07547d; text-decoration:none; font-weight:750; font-size:.9rem; box-shadow:0 2px 8px #06456322; }
    .download-app:hover { background:#e7f9ff; }
    .status { color:#e7f9ff; font-size:.78rem; white-space:nowrap; }
    .panel { background:var(--paper); border:1px solid #d2e8ef; border-radius:18px; padding:18px; box-shadow:0 8px 28px #07547d12; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    .month { font-weight:750; font-size:1.2rem; text-transform:capitalize; color:var(--blue-dark); }
    .nav { display:flex; gap:8px; }
    button { border:1px solid #b9dce8; background:#f5fcfe; color:var(--blue-dark); border-radius:10px; padding:9px 13px; font:inherit; cursor:pointer; font-weight:600; }
    button:hover { background:var(--blue-soft); }
    .grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
    .weekday { color:#527181; text-align:center; font-size:.78rem; font-weight:700; padding:7px 0; }
    .day { min-height:104px; border:1px solid var(--line); border-radius:11px; padding:8px; background:#fff; min-width:0; }
    .day.empty { background:transparent; border-color:transparent; }
    .day.today { border-color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue); background:#f5fcff; }
    .number { font-size:.83rem; color:#66808c; font-weight:650; }
    .booking { display:block; margin-top:6px; padding:4px 6px; border-radius:7px; font-size:.76rem; font-weight:700; overflow-wrap:anywhere; border:1px solid transparent; }
    .booking.future { background:#087eb5; color:#fff; border-color:#066b9c; }
    .booking.past { background:#e4e8eb; color:#59636b; border-color:#cbd2d7; }
    .legend { display:flex; flex-wrap:wrap; gap:16px; margin:15px 2px 0; color:var(--muted); font-size:.84rem; }
    .legend-item { display:inline-flex; align-items:center; gap:7px; }
    .legend-dot { width:12px; height:12px; border-radius:4px; flex:0 0 12px; }
    .message { padding:20px; text-align:center; color:var(--muted); }
    .error { color:#9a3028; }
    footer { color:#607b89; font-size:.78rem; text-align:center; margin-top:16px; }
    @media (max-width:620px) {
      main { padding:14px 8px 26px; }
      header { display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px; }
      .brand { width:100%; align-items:center; flex-direction:column; justify-content:center; gap:8px; text-align:center; }
      .brand img { width:min(100%,300px); max-height:78px; margin:0 auto; }
      .brand-copy { width:100%; text-align:center; }
      .brand-copy h1 { text-align:center; }
      .header-actions { width:100%; align-items:center; margin-top:12px; }
      .download-app { text-align:center; }
      .status { display:block; padding-top:0; text-align:center; }
      .panel { padding:9px; border-radius:14px; }
      .day { min-height:82px; padding:5px; border-radius:8px; }
      .booking { font-size:.66rem; padding:3px 4px; margin-top:4px; }
      .weekday { font-size:.66rem; }
      .number { font-size:.74rem; }
      button { padding:8px 10px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <img src="Florence1-Logo.png" alt="Florence Residence">
      <div class="brand-copy">
        <h1>Reservas do Salão de Festas</h1>
      </div>
    </div>
    <div class="header-actions">
      <a class="download-app" href="https://github.com/GiovaniPasetti/calendario-florence/releases/latest/download/Florence.apk">Baixar aplicativo de cadastro</a>
      <div class="status" id="status" aria-live="polite">Carregando reservas…</div>
    </div>
  </header>
  <section class="panel" aria-label="Calendário de reservas">
    <div class="toolbar">
      <div class="month" id="monthLabel"></div>
      <div class="nav">
        <button id="prev" type="button" aria-label="Mês anterior">‹</button>
        <button id="today" type="button">Hoje</button>
        <button id="next" type="button" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <div class="grid" id="calendar">
      <div class="message">Carregando calendário…</div>
    </div>
    <div class="legend" aria-label="Legenda das reservas">
      <span class="legend-item"><span class="legend-dot" style="background:#087eb5"></span>Reservas futuras</span>
      <span class="legend-item"><span class="legend-dot" style="background:#e4e8eb;border:1px solid #cbd2d7"></span>Reservas realizadas</span>
    </div>
  </section>
</main>
<script>
(() => {
  const monthLabel = document.getElementById('monthLabel');
  const calendar = document.getElementById('calendar');
  const status = document.getElementById('status');
  const weekdays = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const today = new Date();
  let shown = new Date(today.getFullYear(), today.getMonth(), 1);
  let bookings = [];

  function displayApartment(apartment) {
    const value = String(apartment).trim();
    return value === '1000' ? 'Condomínio' : `AP ${value}`;
  }

  function parseDate(value) {
    if (!value) return null;
    const s = String(value).trim();
    let m = s.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    if (d.getFullYear() !== Number(m[1]) || d.getMonth() !== Number(m[2])-1 || d.getDate() !== Number(m[3])) return null;
    return d;
  }
  function key(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function render() {
    monthLabel.textContent = shown.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
    calendar.innerHTML = '';
    weekdays.forEach(w => {
      const el = document.createElement('div');
      el.className = 'weekday'; el.textContent = w; calendar.appendChild(el);
    });
    const first = new Date(shown.getFullYear(), shown.getMonth(), 1);
    const offset = first.getDay();
    const count = new Date(shown.getFullYear(), shown.getMonth()+1, 0).getDate();
    const byDay = new Map();
    bookings.forEach(b => {
      if (!b.date) return;
      const k = key(b.date);
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(b.apartment);
    });
    for (let i=0; i<offset; i++) {
      const blank = document.createElement('div'); blank.className='day empty'; calendar.appendChild(blank);
    }
    for (let n=1; n<=count; n++) {
      const d = new Date(shown.getFullYear(), shown.getMonth(), n);
      const cell = document.createElement('div');
      cell.className = 'day' + (key(d) === key(today) ? ' today' : '');
      const num = document.createElement('div'); num.className='number'; num.textContent=n; cell.appendChild(num);
      (byDay.get(key(d)) || []).forEach(apartment => {
        const chip = document.createElement('span');
        chip.className = 'booking ' + (key(d) < key(today) ? 'past' : 'future');
        chip.textContent = displayApartment(apartment);
        cell.appendChild(chip);
      });
      calendar.appendChild(cell);
    }
  }
  async function load() {
    try {
      const response = await fetch('/.netlify/functions/reservas', {cache:'no-store'});
      if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
      const data = await response.json();
      bookings = (data.records || []).map(r => ({
        apartment: r.apartamento ?? 'Apartamento',
        date: parseDate(r.data)
      })).filter(r => r.date);
      render();
      status.textContent = `Atualizado às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
    } catch (e) {
      status.textContent = 'Não foi possível atualizar';
      calendar.innerHTML = '<div class="message error">Não foi possível carregar as reservas. Confira a configuração do site ou tente novamente em instantes.</div>';
      console.error(e);
    }
  }
  document.getElementById('prev').addEventListener('click', () => { shown.setMonth(shown.getMonth()-1); render(); });
  document.getElementById('next').addEventListener('click', () => { shown.setMonth(shown.getMonth()+1); render(); });
  document.getElementById('today').addEventListener('click', () => { shown = new Date(today.getFullYear(), today.getMonth(), 1); render(); });
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
