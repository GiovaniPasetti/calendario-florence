<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087eb5">
  <title>Cadastro de senha — Florence</title>
  <style>
    :root { color-scheme:light; --ink:#102b3b; --muted:#607b89; --blue:#087eb5; --dark:#07547d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:22px; color:var(--ink); background:linear-gradient(155deg,#e7f8fc 0%,#d2f1f8 48%,#f4fcfd 100%); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    main { width:min(100%,440px); }
    .brand { display:flex; justify-content:center; margin-bottom:18px; }
    .brand img { display:block; width:min(100%,300px); max-height:90px; object-fit:contain; }
    .card { background:#fff; border:1px solid #d2e8ef; border-radius:20px; padding:26px; box-shadow:0 12px 34px #07547d18; }
    h1 { margin:0; text-align:center; color:var(--dark); font-size:1.5rem; }
    .subtitle { margin:8px 0 20px; text-align:center; color:var(--muted); font-size:.92rem; }
    label { display:block; margin:15px 0 6px; font-size:.9rem; font-weight:700; color:#294858; }
    input { width:100%; min-height:48px; padding:11px 13px; border:1px solid #b9dce8; border-radius:11px; background:#fbfeff; color:var(--ink); font:inherit; outline:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #087eb51c; }
    input[readonly] { background:#f1f7f9; }
    button { width:100%; min-height:48px; margin-top:22px; border:0; border-radius:11px; background:linear-gradient(110deg,#087eb5,#12a9cf); color:#fff; font:700 1rem system-ui,sans-serif; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    .message { min-height:22px; margin-top:13px; text-align:center; font-size:.88rem; color:#9a3028; }
    .message.success { color:#16734a; }
    .back { display:block; margin-top:18px; text-align:center; color:var(--dark); text-decoration:none; font-size:.9rem; font-weight:650; }
    @media(max-width:480px) { body { padding:14px; } .card { padding:22px 18px; } }
  </style>
</head>
<body>
<main>
  <div class="brand"><img src="/Florence1-Logo.png" alt="Florence Residence"></div>
  <section class="card">
    <h1 id="title">Criar minha senha</h1>
    <p class="subtitle" id="subtitle">Defina uma senha pessoal para acessar suas reservas.</p>
    <form id="passwordForm">
      <div id="apartmentGroup">
        <label for="apartment">Apartamento</label>
        <input id="apartment" type="text" inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4" required readonly>
      </div>
      <div id="currentGroup" hidden>
        <label for="currentPassword">Senha atual</label>
        <input id="currentPassword" type="password" autocomplete="current-password">
      </div>
      <label for="newPassword">Nova senha</label>
      <input id="newPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
      <label for="confirmPassword">Confirme a nova senha</label>
      <input id="confirmPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
      <button id="saveButton" type="submit">Salvar senha</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <a class="back" href="/login.html">Voltar ao login</a>
  </section>
</main>
<script>
(() => {
  const endpoint = '/.netlify/functions/autenticacao';
  const form = document.getElementById('passwordForm');
  const apartmentInput = document.getElementById('apartment');
  const apartmentGroup = document.getElementById('apartmentGroup');
  const currentGroup = document.getElementById('currentGroup');
  const currentInput = document.getElementById('currentPassword');
  const newInput = document.getElementById('newPassword');
  const confirmInput = document.getElementById('confirmPassword');
  const button = document.getElementById('saveButton');
  const message = document.getElementById('message');
  let mode = 'register';
  const queryApartment = new URLSearchParams(location.search).get('apartment') || '';

  async function initialize() {
    if (queryApartment && /^\d{3,4}$/.test(queryApartment)) apartmentInput.value = queryApartment;
    try {
      const response = await fetch(endpoint, {cache:'no-store'});
      if (response.ok) {
        const data = await response.json();
        if (data.authenticated) {
          mode = 'change';
          document.getElementById('title').textContent = 'Alterar minha senha';
          document.getElementById('subtitle').textContent = 'Informe sua senha atual e escolha uma nova.';
          apartmentGroup.hidden = true;
          currentGroup.hidden = false;
          apartmentInput.required = false;
        }
      }
    } catch { /* A tentativa de cadastro continuará disponível. */ }

    if (mode === 'register') {
      if (!apartmentInput.value) {
        apartmentInput.readOnly = false;
        apartmentInput.placeholder = 'Ex.: 101';
      }
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    message.textContent = '';
    message.className = 'message';

    if (newInput.value !== confirmInput.value) {
      message.textContent = 'As senhas não coincidem.';
      return;
    }
    if (newInput.value.length < 8) {
      message.textContent = 'A senha deve ter pelo menos 8 caracteres.';
      return;
    }

    button.disabled = true;
    button.textContent = 'Salvando…';
    try {
      const payload = mode === 'change'
        ? {action:'changePassword', currentPassword:currentInput.value, newPassword:newInput.value}
        : {action:'register', apartment:apartmentInput.value.trim(), newPassword:newInput.value};

      const response = await fetch(endpoint, {
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Não foi possível salvar a senha.');
      message.textContent = 'Senha salva com sucesso. Acessando suas reservas…';
      message.className = 'message success';
      setTimeout(() => location.replace('/morador.html'), 700);
    } catch (error) {
      message.textContent = error.message || 'Falha de comunicação. Tente novamente.';
    } finally {
      button.disabled = false;
      button.textContent = 'Salvar senha';
    }
  });

  initialize();
})();
</script>
</body>
</html>
